<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ede2">
<title>Kelionių gidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700;6..96,900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&family=Allura&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f3ede2;
    --paper: #faf6ee;
    --sand: #e4dac7;
    --taupe: #cdbfa6;
    --olive: #6f7a52;
    --olive-d: #4d5638;
    --ink: #1f1d18;
    --muted: #867f6d;
    --display: "Bodoni Moda", "Didot", Georgia, serif;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --script: "Allura", "Segoe Script", "Brush Script MT", cursive;
    --nav-h: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { font-family: var(--sans); color: var(--ink); background: #bdb29b; display: flex; align-items: center; justify-content: center; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  a { color: inherit; }

  .phone { position: relative; width: 100%; max-width: 420px; height: 100dvh; max-height: 880px; background: var(--cream); overflow: hidden; display: flex; flex-direction: column; isolation: isolate; }
  @media (min-width: 560px) { .phone { border-radius: 42px; border: 9px solid #1d1b16; box-shadow: 0 40px 90px rgba(50,40,20,.45); } }
  .phone::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 60; opacity: .22; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .36  0 0 0 0 .26  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  .screen { flex: 1; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; display: flex; flex-direction: column; }
  .screen > * { flex: 1 0 auto; }
  .view.full { display: flex; flex-direction: column; padding-bottom: 0; }
  .view.full .side { flex: 1; }
  .screen::-webkit-scrollbar { width: 0; }
  .view { min-height: 100%; padding-bottom: 28px; animation: enter .5s cubic-bezier(.2,.7,.2,1); }
  .view.pad { padding-top: 58px; }
  @keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i, 0) * 60ms + 120ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* Viršutinė juosta */
  .topbar { position: absolute; top: 0; left: 0; right: 0; height: 58px; padding: 10px 16px; display: flex; gap: 10px; align-items: center; z-index: 25; pointer-events: none; }
  .topbar button { pointer-events: auto; width: 38px; height: 38px; border-radius: 50%; background: rgba(250,246,238,.82); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(60,50,30,.15); color: var(--olive-d); }
  .topbar svg { width: 20px; height: 20px; }
  .topbar button[hidden] { display: none; }
  .topbar.hidden { display: none; }

  svg.ic { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  /* Paveikslai */
  .art { position: relative; overflow: hidden; background: var(--sand); }
  .art > svg, .art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .art > img { opacity: 0; transition: opacity .7s ease; }
  .art > img.in { opacity: 1; }
  .arch { border-radius: 999px 999px 22px 22px; }
  .arch-sm { border-radius: 999px 999px 14px 14px; }
  .round { border-radius: 18px; }

  /* Viršelis */
  .cover { position: relative; min-height: 100%; padding: 26px 22px 28px; display: flex; flex-direction: column; align-items: center; }
  .cover .small { letter-spacing: .38em; font-size: 10.5px; text-transform: uppercase; color: var(--muted); font-weight: 500; z-index: 3; }
  .cover h1 { font-family: var(--display); font-weight: 900; font-size: clamp(92px, 27vw, 118px); line-height: .85; letter-spacing: -.01em; margin-top: 8px; z-index: 3; position: relative; text-shadow: 0 2px 0 rgba(255,255,255,.35); }
  .cover .art { width: 100%; flex: 1; min-height: 330px; margin-top: -38px; z-index: 1; box-shadow: 0 18px 40px rgba(70,55,30,.25); }
  .cover .foot { text-align: center; margin-top: 16px; z-index: 3; }
  .script { font-family: var(--script); }
  .cover .foot .script { font-size: 46px; line-height: 1; }
  .cover .dates { font-size: 12px; letter-spacing: .3em; font-weight: 500; margin: 6px 0 16px; }
  .btn-main { background: var(--olive); color: #fff; padding: 14px 34px; border-radius: 999px; font-weight: 500; letter-spacing: .14em; font-size: 12px; text-transform: uppercase; box-shadow: 0 8px 20px rgba(79,86,56,.35); transition: transform .15s; }
  .btn-main:active { transform: scale(.97); }
  .drift { animation: drift 14s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(18px); } }

  /* Antraštės */
  .ttl { position: relative; padding: 4px 24px 0; }
  .ttl .a { display: block; font-family: var(--serif); font-weight: 700; font-size: 50px; line-height: .9; letter-spacing: -.01em; }
  .ttl .b { display: block; font-family: var(--script); color: var(--olive); font-size: 46px; line-height: 1; margin: -12px 0 0 54px; }
  .lead { padding: 10px 26px 4px; color: var(--muted); font-size: 14px; line-height: 1.65; }
  .section { padding: 10px 20px; }
  .eyebrow { font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; text-align: center; font-weight: 600; }

  /* Ikonų meniu */
  .panel { background: var(--sand); margin: 14px 18px; border-radius: 26px; padding: 18px 10px 12px; }
  .grid-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 2px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 14px 4px 10px; color: var(--olive-d); border-radius: 16px; transition: transform .15s, background .15s; }
  .tile:active { transform: scale(.94); background: rgba(255,255,255,.4); }
  .tile svg { width: 38px; height: 38px; stroke-width: 1.3; }
  .tile span { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }
  .hint { text-align: center; font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; margin-top: 6px; color: var(--muted); }

  /* Maršrutas */
  .split { display: flex; align-items: stretch; gap: 0; }
  .vert { writing-mode: vertical-rl; transform: rotate(180deg); display: flex; align-items: center; gap: 0; padding: 18px 8px 18px 20px; flex: none; }
  .vert .a { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; }
  .vert .b { font-family: var(--script); font-size: 40px; color: var(--olive); margin-top: 12px; }
  .stops { flex: 1; padding: 8px 18px 8px 4px; }
  .stop { display: block; width: 100%; text-align: left; background: var(--paper); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 2px 10px rgba(80,70,40,.07); position: relative; }
  .stop h4 { font-family: var(--display); font-size: 21px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; line-height: 1.1; }
  .stop .d { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 4px; font-weight: 500; }
  .stop::after { content: "›"; position: absolute; right: 16px; top: 50%; transform: translateY(-52%); font-size: 26px; color: var(--taupe); }

  /* Vietos detalė */
  .hero { height: 330px; margin: 0 22px; }
  .place-title { position: relative; text-align: center; margin-top: -58px; z-index: 3; }
  .place-title h2 { font-family: var(--display); font-weight: 900; font-size: 62px; text-transform: uppercase; line-height: 1; text-shadow: 0 2px 0 rgba(255,255,255,.4); letter-spacing: .02em; }
  .place-title .script { font-size: 42px; color: var(--olive); margin-top: -4px; }
  .prose { padding: 8px 30px 0; font-size: 14.5px; line-height: 1.75; color: #4a463b; text-align: center; }

  /* Skrydis */
  .tabs { display: flex; gap: 8px; padding: 14px 22px 0; }
  .tabs button { flex: 1; padding: 11px; border-radius: 999px; background: var(--sand); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; color: var(--olive-d); }
  .tabs button.on { background: var(--olive); color: #fff; }
  .flight-card { margin: 14px 22px 0; background: var(--paper); border-radius: 22px; overflow: hidden; box-shadow: 0 4px 18px rgba(80,70,40,.1); }
  .flight-card .art { height: 150px; }
  .route { display: flex; align-items: center; gap: 8px; padding: 18px 20px 6px; }
  .route .code { font-family: var(--display); font-weight: 900; font-size: 42px; line-height: 1; }
  .route .city { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .route .mid { flex: 1; text-align: center; color: var(--olive); position: relative; height: 24px; }
  .route .mid::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px dotted var(--taupe); }
  .route .mid svg { position: relative; width: 24px; height: 24px; background: var(--paper); padding: 0 3px; transform: rotate(90deg); }
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; padding: 14px 20px 20px; }
  .meta small { display: block; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .meta b { font-family: var(--serif); font-size: 22px; font-weight: 700; }

  /* Kortelės */
  .card { background: var(--paper); border-radius: 22px; padding: 14px; margin-bottom: 14px; box-shadow: 0 3px 14px rgba(80,70,40,.08); }
  .card .art { height: 150px; margin-bottom: 12px; }
  .card h3 { font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1.15; }
  .card p { color: var(--muted); font-size: 13.5px; line-height: 1.6; margin-top: 4px; }
  .pill { display: inline-block; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; background: var(--sand); color: var(--olive-d); padding: 5px 11px; border-radius: 999px; font-weight: 600; margin: 8px 6px 0 0; }
  .mapbtn { display: inline-block; margin-top: 10px; font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; background: var(--olive); color: #fff; padding: 7px 14px; border-radius: 999px; text-decoration: none; }
  .kv { display: flex; flex-direction: column; gap: 3px; padding: 13px 0; border-bottom: 1px dashed var(--taupe); font-size: 14px; }
  .kv:last-child { border: none; }
  .kv span:first-child { font-family: var(--serif); font-size: 20px; font-weight: 700; }
  .kv span:last-child { color: #5a5547; text-align: left; line-height: 1.6; font-size: 14px; }

  /* Dienų puslapis su šonine juosta */
  .side { display: flex; min-height: calc(100% - 0px); }
  .strip { width: 26%; flex: none; position: relative; }
  .strip .art { position: absolute; inset: 0; border-radius: 0 0 0 0; }
  .side .main { flex: 1; padding: 12px 18px 24px 16px; min-width: 0; }
  .days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px 0 10px; }
  .dbtn { aspect-ratio: 1; border-radius: 50%; background: var(--sand); color: var(--olive-d); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 8.5px; letter-spacing: .18em; font-weight: 600; transition: transform .15s, background .15s; }
  .dbtn b { font-family: var(--display); font-size: 24px; letter-spacing: 0; line-height: 1.05; font-weight: 700; }
  .dbtn:active { transform: scale(.92); background: var(--taupe); }
  .slot { font-family: var(--serif); font-size: 28px; font-weight: 700; margin: 18px 0 4px; display: flex; align-items: center; gap: 10px; }
  .slot::after { content: ""; flex: 1; border-top: 1px solid var(--taupe); }
  .it { display: flex; gap: 12px; padding: 9px 0; }
  .it .t { width: 46px; flex: none; font-size: 11px; letter-spacing: .08em; font-weight: 600; color: var(--olive-d); padding-top: 3px; }
  .it .x { font-size: 14.5px; line-height: 1.4; }
  .it .mini { display: inline-block; margin-top: 5px; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; color: var(--olive-d); background: var(--sand); padding: 4px 10px; border-radius: 999px; text-decoration: none; }
  .it .n { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .daynav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .daynav button { background: var(--sand); padding: 10px 16px; border-radius: 999px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--olive-d); }
  .daynav button:disabled { opacity: .3; }

  /* Tinkleliai (maistas / vietos) */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; padding: 4px 20px; }
  .cell { text-align: center; }
  .cell .art { aspect-ratio: 1 / 1.05; }
  .cell.tall .art { aspect-ratio: 3 / 4; }
  .cell h4 { font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.05; margin-top: 10px; }
  .cell small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; line-height: 1.4; }
  .cell .badge { display: inline-block; margin-top: 8px; font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; background: var(--sand); color: var(--olive-d); padding: 5px 11px; border-radius: 999px; text-decoration: none; }

  /* Pakuotė */
  .progress { height: 7px; background: var(--sand); border-radius: 999px; overflow: hidden; margin: 8px 0 14px; }
  .progress i { display: block; height: 100%; background: var(--olive); transition: width .35s; }
  .check { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px dashed var(--taupe); font-size: 14.5px; cursor: pointer; }
  .check:last-child { border: none; }
  .box { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--olive); flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; transition: background .15s; }
  .check.done .box { background: var(--olive); }
  .check.done .label { text-decoration: line-through; color: var(--muted); }

  .prepbar { display: flex; align-items: center; gap: 14px; width: calc(100% - 36px); margin: 12px 18px 0; padding: 14px 16px; border-radius: 20px; background: var(--olive); color: #fff; text-align: left; box-shadow: 0 8px 20px rgba(79,86,56,.3); }
  .prepbar svg { width: 30px; height: 30px; flex: none; }
  .prepbar .pt { flex: 1; min-width: 0; }
  .prepbar b { display: block; font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.1; }
  .prepbar small { display: block; font-size: 11px; opacity: .85; margin-top: 2px; }
  .prepbar .chev { font-size: 26px; opacity: .7; }
  .step { display: flex; gap: 14px; background: var(--paper); border-radius: 22px; padding: 16px; margin-bottom: 14px; box-shadow: 0 3px 14px rgba(80,70,40,.08); }
  .step .num { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--olive); flex: none; font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--olive-d); display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .step.done .num { background: var(--olive); color: #fff; }
  .step.done h3 { color: var(--muted); }
  .step h3 { font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 1.2; }
  .step .sb p { color: #5a5547; font-size: 13.5px; line-height: 1.6; margin-top: 6px; }
  .sub { font-family: var(--serif); font-size: 32px; font-weight: 700; margin: 26px 4px 12px; }
  .step .sb p.warn { color: #8a5a2b; background: #f3e3c8; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }

  /* Apatinė juosta */
  nav { height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--sand); display: flex; justify-content: space-around; align-items: center; flex: none; border-radius: 22px 22px 0 0; box-shadow: 0 -6px 20px rgba(70,55,30,.1); position: relative; z-index: 10; }
  nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #a99f88; padding: 6px 7px; font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; transition: color .15s, transform .15s; }
  nav button svg { width: 24px; height: 24px; }
  nav button.on { color: var(--olive-d); transform: translateY(-2px); }
  nav button.on::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--olive); margin-top: 1px; }
  .nonav nav { display: none; }

  /* Šoninis meniu */
  .drawer { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
  .drawer .shade { position: absolute; inset: 0; background: rgba(30,26,18,.45); opacity: 0; transition: opacity .3s; }
  .drawer .sheet { position: absolute; top: 0; bottom: 0; left: 0; width: 76%; background: var(--cream); transform: translateX(-102%); transition: transform .38s cubic-bezier(.2,.7,.2,1); padding: 70px 22px 24px; overflow-y: auto; border-radius: 0 28px 28px 0; }
  .drawer.open { pointer-events: auto; }
  .drawer.open .shade { opacity: 1; }
  .drawer.open .sheet { transform: none; }
  .drawer .brand { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; }
  .drawer .brand + .script { font-size: 30px; color: var(--olive); margin: -2px 0 14px; }
  .drawer .item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 4px; border-bottom: 1px dashed var(--taupe); text-align: left; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; }
  .drawer .item svg { width: 24px; height: 24px; color: var(--olive); stroke-width: 1.4; }

  /* ===== Kompiuteris / didelis ekranas: plati svetainė ===== */
  @media (min-width: 900px) {
    body { display: block; background: var(--cream); }
    .phone { max-width: none; max-height: none; width: 100%; height: 100dvh; border: none; border-radius: 0; box-shadow: none; flex-direction: row; }
    nav { order: -1; flex: none; width: 210px; height: auto; flex-direction: column; justify-content: flex-start; align-items: stretch; gap: 4px; padding: 28px 14px; border-radius: 0; box-shadow: 6px 0 24px rgba(70,55,30,.08); border-top: none; }
    nav::before { content: "Kelionės lietuviams"; font-family: var(--display); font-weight: 900; font-size: 22px; line-height: 1.1; padding: 4px 12px 22px; color: var(--olive-d); }
    nav button { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 12px 14px; border-radius: 14px; font-size: 11px; letter-spacing: .14em; }
    nav button svg { width: 22px; height: 22px; }
    nav button:hover { background: rgba(255,255,255,.45); }
    nav button.on { background: var(--paper); transform: none; box-shadow: 0 2px 10px rgba(70,55,30,.1); }
    nav button.on::after { display: none; }
    .screen > * { width: 100%; max-width: 1040px; align-self: center; }
    .topbar { left: 210px; right: 0; }
    .nonav .topbar { left: 0; }
    .cover { max-width: 600px; padding-top: 36px; }
    .cover .art { min-height: 460px; }
    .grid-menu { grid-template-columns: repeat(4, 1fr); }
    .tile svg { width: 42px; height: 42px; }
    .panel { margin: 18px 24px; padding: 24px 16px 16px; }
    .prepbar { width: calc(100% - 48px); margin: 14px 24px 0; }
    .two { grid-template-columns: repeat(4, 1fr); gap: 20px 18px; padding: 8px 24px; }
    .days { grid-template-columns: repeat(5, 1fr); gap: 16px; padding: 18px 0 10px; }
    .section { padding: 10px 24px; }
    .section:has(> .card) { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .section > .card { margin-bottom: 0; }
    .section > .progress { grid-column: 1 / -1; }
    .hero { height: 440px; max-width: 520px; margin: 0 auto; }
    .prose { max-width: 620px; margin: 0 auto; font-size: 16px; }
    .flight-card, .tabs { max-width: 560px; margin-left: auto; margin-right: auto; }
    .strip { width: 30%; }
    .side .main { padding: 12px 36px 28px 28px; }
    .ttl .a { font-size: 62px; } .ttl .b { font-size: 56px; margin-left: 66px; }
    .drawer .sheet { width: 340px; }
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="topbar hidden" id="topbar">
    <button id="menuBtn" aria-label="Meniu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <button id="backBtn" aria-label="Atgal" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  </div>
  <div class="screen" id="screen"></div>
  <nav id="nav"></nav>
  <div class="drawer" id="drawer"><div class="shade" id="shade"></div><div class="sheet" id="sheet"></div></div>
</div>

<script>
/* ============================================================
   ČIA KEISK SAVO KELIONĖS DUOMENIS

const PK = "gidas_foto_v1";
let photoCache = {};
try { photoCache = JSON.parse(localStorage.getItem(PK)) || {}; } catch (e) {}
async function wikiPhoto(q) {
  if (photoCache[q]) return photoCache[q];
  const url = "https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=" + encodeURIComponent(q) +
    "&gsrlimit=8&prop=pageimages&piprop=thumbnail&pithumbsize=900&pilimit=8&format=json&origin=*";
  const j = await (await fetch(url)).json();
  const pages = Object.values((j.query && j.query.pages) || {})
    .filter(p => p.thumbnail && p.thumbnail.source && !/\.svg/i.test(p.thumbnail.source))
    .sort((a, b) => a.index - b.index);
  const src = pages[0] && pages[0].thumbnail.source;
  if (src) { photoCache[q] = src; try { localStorage.setItem(PK, JSON.stringify(photoCache)); } catch (e) {} }
  return src;
}
function hydrate() {
  document.querySelectorAll(".art[data-wiki]:not([data-done])").forEach(el => {
    el.dataset.done = "1";
    wikiPhoto(el.dataset.wiki).then(src => {
      if (!src) return;
      const im = new Image();
      im.alt = ""; im.decoding = "async";
      im.onload = () => { if (!el.isConnected) return; el.appendChild(im); requestAnimationFrame(() => im.classList.add("in")); };
      im.src = src;
    }).catch(() => {});
  });
}

  things() { return tallGrid("Things", "to Do", TRIP.things); },
  attire() { return listPage("Attire", "what to wear", TRIP.attire); },
  transport() { return listPage("Transport", "getting around", TRIP.transport); },
  tips() { return listPage("Good", "to know", TRIP.tips); },
  packing() {
    const done = getChecks(), n = TRIP.packing.filter(p => done[p]).length, pct = Math.round(n / TRIP.packing.length * 100);
    return `<div class="view pad">${ttl("Packing", "List")}<div class="lead rise" ${rise(1)}>${n} iš ${TRIP.packing.length} supakuota</div>
      <div class="section"><div class="progress"><i style="width:${pct}%"></i></div><div class="card" style="padding:6px 18px">${TRIP.packing.map(p => `<div class="check ${done[p] ? "done" : ""}" data-check="${esc(p)}"><div class="box">${done[p] ? "✓" : ""}</div><div class="label">${esc(p)}</div></div>`).join("")}</div></div></div>`;
  }
};
function placeGrid(a, b, items) {
  return `<div class="view pad">${ttl(a, b)}<div class="two" style="margin-top:14px">${items.map((e, i) => `<div class="cell rise" ${rise(i + 1)}>${art(e.scene, e.photo, "round", e.wiki)}<h4>${esc(e.name)}</h4><small>${esc(e.where)}${e.price ? " · " + esc(e.price) : ""}</small><small>${esc(e.note)}</small><a class="badge" target="_blank" rel="noopener" href="${mapUrl(e.name + " " + e.where)}">Žemėlapis</a></div>`).join("")}</div></div>`;
}
function tallGrid(a, b, items, clickable) {
  return `<div class="view pad">${ttl(a, b)}<div class="two" style="margin-top:14px">${items.map((e, i) => `<div class="cell tall rise" ${rise(i + 1)}${clickable ? ` data-spot="${i}" style="cursor:pointer"` : ""}>${art(e.scene, e.photo, "arch-sm", e.wiki)}<h4>${esc(e.name)}</h4><small>${esc(e.note)}</small>${clickable && e.text ? `<span class="badge" style="background:var(--olive);color:#fff">Daugiau</span> ` : ""}<a class="badge" target="_blank" rel="noopener" href="${mapUrl(e.map)}">Žemėlapis</a></div>`).join("")}</div></div>`;
}
function listPage(a, b, rows) {
  return `<div class="view pad">${ttl(a, b)}<div class="section"><div class="card rise" ${rise(1)} style="padding:6px 18px">${rows.map(([x, y]) => `<div class="kv"><span>${esc(x)}</span><span>${esc(y)}</span></div>`).join("")}</div></div></div>`;
}

/* ---------- Būsena ---------- */
const S = { flight: 0 };
const CK = "gidas_pakuotis_v2";
function getChecks() { try { return JSON.parse(localStorage.getItem(CK)) || {}; } catch (e) { return {}; } }
function setCheck(k, v) { const c = getChecks(); c[k] = v; try { localStorage.setItem(CK, JSON.stringify(c)); } catch (e) {} }

const PRK = "gidas_prep_v1";
function getPrep() { try { return JSON.parse(localStorage.getItem(PRK)) || {}; } catch (e) { return {}; } }
function isDone(x, st) { return x.id in st ? !!st[x.id] : !!x.done; }
function prepCount() { const st = getPrep(); return TRIP.prep.filter(x => isDone(x, st)).length; }

/* ---------- Naršymas ---------- */
let stack = [];
function go(name, arg, push = true) {
  if (push) stack.push([name, arg]);
  const html = V[name] ? V[name](arg) : V.home();
  $("screen").innerHTML = html;
  $("screen").scrollTop = 0;
  const cover = name === "cover";
  $("phone").classList.toggle("nonav", cover);
  $("topbar").classList.toggle("hidden", cover);
  $("backBtn").hidden = stack.length < 2 || name === "home";
  const key = { day: "daily", place: "overview", spot: "visit" }[name] || name;
  $("nav").innerHTML = NAV.map(([k, l]) => `<button data-go="${k}" class="${k === key ? "on" : ""}">${ic(k)}<span>${l}</span></button>`).join("");
  $("screen").querySelectorAll("[data-i]").forEach(e => e.style.setProperty("--i", e.dataset.i));
  closeDrawer();
  hydrate();
}
function back() {
  if (stack.length > 1) { stack.pop(); const [n, a] = stack[stack.length - 1]; go(n, a, false); }
}
function openDrawer() {
  $("sheet").innerHTML = `<div class="brand">${esc(TRIP.title)}</div><div class="script">${esc(TRIP.script)}</div>` +
    [["home", "Pradžia"], ["prep", "Prieš kelionę"], ...MENU, ["tips", "Patarimai"]].map(([k, l]) => `<button class="item" data-go="${k}">${ic(k)}<span>${l}</span></button>`).join("") + `<p style="font-size:10.5px;color:var(--muted);margin-top:18px;line-height:1.5">Nuotraukos: Wikipedia / Wikimedia Commons (autorių teisės ir licencijos nurodytos prie originalų).</p>`;
  $("drawer").classList.add("open");
}
function closeDrawer() { $("drawer").classList.remove("open"); }

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
  const d = e.target.closest("[data-day]"); if (d && !d.disabled) return go("day", Number(d.dataset.day));
  if (e.target.closest("a")) return;
  const sp = e.target.closest("[data-spot]"); if (sp) return go("spot", Number(sp.dataset.spot));
  const p = e.target.closest("[data-place]"); if (p) return go("place", Number(p.dataset.place));
  const f = e.target.closest("[data-flight]"); if (f) { S.flight = Number(f.dataset.flight); return go("flight", undefined, false); }
  const pr = e.target.closest("[data-prep]");
  if (pr) { const x = TRIP.prep.find(i => i.id === pr.dataset.prep), st = getPrep(), y = $("screen").scrollTop; st[x.id] = !isDone(x, st); try { localStorage.setItem(PRK, JSON.stringify(st)); } catch (e) {} go("prep", undefined, false); $("screen").scrollTop = y; return; }
  const c = e.target.closest("[data-check]");
  if (c) { const k = c.dataset.check, y = $("screen").scrollTop; setCheck(k, !getChecks()[k]); go("packing", undefined, false); $("screen").scrollTop = y; }
});
$("menuBtn").addEventListener("click", openDrawer);
$("shade").addEventListener("click", closeDrawer);
$("backBtn").addEventListener("click", back);

document.title = "Kelionių gidas · " + TRIP.title;
go("cover");
</script>
</body>
</html>
